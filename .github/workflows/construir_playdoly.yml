name: Construir Play Doly
on:
  push:
    paths:
      - 'PlayDoly_v*.zip'
      - '.github/workflows/construir_playdoly.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escoger el zip con el número más alto
        run: |
          Z=$(ls PlayDoly_v*.zip | sort -V | tail -1)
          N=$(echo "$Z" | sed 's/[^0-9]//g')
          echo "Usando $Z (versión $N)"
          echo "N=$N" >> $GITHUB_ENV
          unzip -o "$Z" -d proyecto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Armar la app
        working-directory: proyecto
        run: gradle assembleRelease --no-daemon
      - name: Copiar el instalador con su número
        run: cp proyecto/app/build/outputs/apk/release/app-release.apk PlayDoly_v${{ env.N }}.apk
      - name: Publicar para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: playdoly-v${{ env.N }}
          name: Play Doly ${{ env.N }}
          files: PlayDoly_v${{ env.N }}.apk
          make_latest: false

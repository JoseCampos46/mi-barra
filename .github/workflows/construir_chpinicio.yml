name: Construir ChpInicio
on:
  push:
    paths:
      - 'MiBarra_v*.zip'
      - '.github/workflows/construir_chpinicio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escoger el zip de ChpBar con el número más alto
        run: |
          Z=$(ls MiBarra_v*.zip | sort -V | tail -1)
          N=$(echo "$Z" | sed 's/[^0-9]//g')
          echo "Usando $Z (versión $N)"
          echo "N=$N" >> $GITHUB_ENV
          unzip -o "$Z" -d proyecto
      - name: Convertir en ChpInicio (pantalla de inicio aparte)
        working-directory: proyecto
        run: |
          test -f app/chpinicio/AndroidManifest.xml
          cp app/chpinicio/AndroidManifest.xml app/src/main/AndroidManifest.xml
          sed -i "s/applicationId 'co.jose.mibarra'/applicationId 'co.jose.chpinicio'/" app/build.gradle
          grep -n applicationId app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Armar la app
        working-directory: proyecto
        run: gradle assembleRelease --no-daemon
      - name: Copiar el instalador con su número
        run: cp proyecto/app/build/outputs/apk/release/app-release.apk ChpInicio_v${{ env.N }}.apk
      - name: Publicar para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chpinicio-v${{ env.N }}
          name: ChpInicio ${{ env.N }}
          files: ChpInicio_v${{ env.N }}.apk
          make_latest: false

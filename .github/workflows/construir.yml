name: Construir Mi Barra
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el proyecto
        run: unzip -o *.zip -d proyecto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Armar la app
        working-directory: proyecto
        run: gradle assembleRelease --no-daemon
      - name: Copiar el instalador
        run: cp proyecto/app/build/outputs/apk/release/app-release.apk MiBarra.apk
      - name: Publicar para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mi Barra ${{ github.run_number }}
          files: MiBarra.apk

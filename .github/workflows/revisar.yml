name: Revisar que compile (sin publicar)
on:
  push:
    branches: [ revisar-v47 ]
jobs:
  revisar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [chpbar, chpinicio, medir, calcu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Preparar variante
        working-directory: proyecto
        run: |
          A=${{ matrix.app }}
          if [ "$A" = "chpinicio" ]; then M=app/chpinicio/AndroidManifest.xml
          elif [ "$A" = "recordatorios" ]; then M=app/chprecordatorios/AndroidManifest.xml
          elif [ "$A" != "chpbar" ]; then M=app/variantes/$A/AndroidManifest.xml; fi
          if [ "$A" != "chpbar" ]; then
            cp $M app/src/main/AndroidManifest.xml
            sed -i "s/applicationId 'co.jose.mibarra'/applicationId 'co.jose.x$A'/" app/build.gradle
            if [ "$A" != "medir" ]; then printf "\nandroid { packaging { jniLibs { excludes += ['**/libvosk.so', '**/libjnidispatch.so'] } } }\n" >> app/build.gradle; fi
          fi
      - name: Armar
        working-directory: proyecto
        run: gradle assembleRelease --no-daemon && ls -la app/build/outputs/apk/release/

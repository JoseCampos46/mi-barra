name: Revisar que compile (sin publicar)
on:
  push:
    branches: [ revisar-v47 ]
jobs:
  revisar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [chpbar, chpinicio, chprecordatorios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Preparar variante
        working-directory: proyecto
        run: |
          if [ "${{ matrix.app }}" != "chpbar" ]; then
            cp app/${{ matrix.app }}/AndroidManifest.xml app/src/main/AndroidManifest.xml
            sed -i "s/applicationId 'co.jose.mibarra'/applicationId 'co.jose.${{ matrix.app }}'/" app/build.gradle
          fi
      - name: Armar
        working-directory: proyecto
        run: gradle assembleRelease --no-daemon
